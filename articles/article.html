<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… — Yashika Barhaiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bone:    #F5F0E8;
  --espresso:#1C1410;
  --gold:    #A8844A;
  --stone:   #E8E4DC;
  --mid:     #6B5F52;
  --soft:    #A99B8C;
  --rule:    #D9D3C7;
  --gold-pale:#F2EBD9;
  --serif: 'Cormorant Garamond', 'Garamond', Georgia, serif;
  --sans:  'Neue Haas Grotesk Text', 'HelveticaNeue', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  background: var(--bone);
  color: var(--espresso);
  font-family: var(--sans);
  font-weight: 400;
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 2.25rem 4.5rem;
  display: flex; align-items: center; justify-content: space-between;
  transition: padding 0.4s, background 0.4s, border-color 0.4s;
  border-bottom: 1px solid transparent;
}
nav.stuck {
  padding: 1.25rem 4.5rem;
  background: rgba(245,240,232,0.96);
  backdrop-filter: blur(20px);
  border-color: var(--rule);
}
.nav-mark {
  font-family: var(--serif);
  font-weight: 400; font-size: 1.05rem; letter-spacing: 0.04em;
  color: var(--espresso); text-decoration: none;
}
.nav-back {
  font-size: 0.7rem; font-weight: 400;
  letter-spacing: 0.16em; text-transform: uppercase;
  text-decoration: none; color: var(--soft);
  display: flex; align-items: center; gap: 0.5rem;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--espresso); }
.nav-back:hover .nav-back-arrow { transform: translateX(-3px); }
.nav-back-arrow { display: inline-block; transition: transform 0.2s; }

/* LOADING STATE */
.loading-state {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--soft);
}

/* ARTICLE LAYOUT */
.article-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 14rem 2rem 10rem;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.article-wrap.ready { opacity: 1; }

/* HEADER */
.article-category {
  font-size: 0.63rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: 1.5rem;
}
.article-title {
  font-family: var(--serif);
  font-size: clamp(2.4rem, 5vw, 3.8rem);
  font-weight: 300; line-height: 1.08;
  letter-spacing: -0.01em; color: var(--espresso);
  margin-bottom: 2rem;
}
.article-meta {
  display: flex; gap: 2rem; align-items: center;
  padding: 1.5rem 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 4rem;
}
.article-meta-item {
  font-size: 0.67rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--soft);
}
.article-meta-item strong {
  color: var(--mid); font-weight: 400; display: block;
  font-size: 0.72rem; letter-spacing: 0.04em;
  text-transform: none; margin-bottom: 0.15rem;
}

/* BODY */
.article-body { font-size: 1rem; line-height: 1.9; color: var(--mid); }
.article-body p { margin-bottom: 1.8rem; }
.article-body h2 {
  font-family: var(--serif); font-size: 1.75rem; font-weight: 400;
  line-height: 1.2; color: var(--espresso); margin: 3.5rem 0 1.2rem;
}
.article-body h3 {
  font-family: var(--serif); font-size: 1.25rem; font-weight: 500;
  color: var(--espresso); margin: 2.5rem 0 0.8rem;
}
.article-body strong { color: var(--espresso); font-weight: 500; }
.article-body em { font-style: italic; }
.article-body blockquote {
  border-left: 2px solid var(--gold);
  padding: 0.5rem 0 0.5rem 2rem; margin: 2.5rem 0;
  font-family: var(--serif); font-size: 1.25rem;
  font-weight: 300; font-style: italic;
  color: var(--espresso); line-height: 1.5;
}
.article-body ul { list-style: none; margin: 1.5rem 0 1.8rem; padding: 0; }
.article-body ul li {
  padding-left: 1.4rem; position: relative;
  margin-bottom: 0.6rem; font-size: 0.95rem;
  line-height: 1.85; color: var(--mid);
}
.article-body ul li::before {
  content: '\2014'; position: absolute; left: 0;
  color: var(--gold); font-size: 0.72rem; top: 0.28rem;
}
.article-rule { width: 48px; height: 1px; background: var(--gold); margin: 4rem 0; }

/* FOOTER NAV */
.article-footer-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3rem 0 0; border-top: 1px solid var(--rule); margin-top: 5rem;
}
.article-footer-link {
  font-size: 0.7rem; letter-spacing: 0.16em;
  text-transform: uppercase; text-decoration: none;
  color: var(--soft); display: flex; align-items: center; gap: 0.5rem;
  transition: color 0.2s;
}
.article-footer-link:hover { color: var(--gold); }
.article-footer-link.hidden { visibility: hidden; pointer-events: none; }

/* PAGE FOOTER */
footer {
  padding: 3rem 4.5rem;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--rule);
}
footer p { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--soft); }
footer em { font-family: var(--serif); font-style: italic; }

@media (max-width: 1024px) {
  nav { padding: 1.75rem 3rem; }
  nav.stuck { padding: 1rem 3rem; }
  footer { padding: 2rem 3rem; }
}
@media (max-width: 680px) {
  nav { padding: 1.25rem 1.75rem; }
  nav.stuck { padding: 0.9rem 1.75rem; }
  .article-wrap { padding: 10rem 1.75rem 6rem; }
  footer { padding: 2rem 1.75rem; flex-direction: column; gap: 0.5rem; text-align: center; }
  .article-meta { flex-wrap: wrap; gap: 1rem; }
}
</style>
</head>
<body>

<nav id="nav">
  <a href="../index.html" class="nav-mark">Yashika Barhaiya</a>
  <a href="../index.html#thoughts" class="nav-back">
    <span class="nav-back-arrow">&#8592;</span> All writing
  </a>
</nav>

<div id="loading" class="loading-state">Loading&hellip;</div>

<article id="article" class="article-wrap" style="display:none">

  <header>
    <div id="article-category" class="article-category"></div>
    <h1 id="article-title" class="article-title"></h1>
    <div class="article-meta">
      <div class="article-meta-item"><strong>Yashika Barhaiya</strong>Author</div>
      <div class="article-meta-item"><strong id="article-date"></strong>Published</div>
      <div class="article-meta-item"><strong id="article-readtime"></strong>Length</div>
    </div>
  </header>

  <div id="article-body" class="article-body"></div>

  <nav class="article-footer-nav">
    <a id="prev-link" href="#" class="article-footer-link">&#8592; Previous article</a>
    <a id="next-link" href="#" class="article-footer-link">Next article &#8594;</a>
  </nav>

</article>

<footer>
  <p><em>Yashika Barhaiya</em> &nbsp;&middot;&nbsp; Supply Chain Digital Transformation</p>
  <p>&copy; 2026 &nbsp;&middot;&nbsp; <a href="../index.html" style="color:inherit;text-decoration:none;">Back to portfolio</a></p>
</footer>

<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('stuck', window.scrollY > 80), { passive: true });

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');

if (!slug) {
  window.location.replace('../index.html#thoughts');
} else {
  fetch('data/' + slug + '.json')
    .then(r => { if (!r.ok) throw new Error('Not found'); return r.json(); })
    .then(renderArticle)
    .catch(() => window.location.replace('../index.html#thoughts'));
}

function renderArticle(a) {
  document.title = a.title + ' — Yashika Barhaiya';

  document.getElementById('article-category').innerHTML = a.category;
  document.getElementById('article-title').textContent = a.title;
  document.getElementById('article-date').textContent = a.date;
  document.getElementById('article-readtime').textContent = a.readTime;
  document.getElementById('article-body').innerHTML = a.content;

  const prevLink = document.getElementById('prev-link');
  const nextLink = document.getElementById('next-link');

  if (a.prev) {
    prevLink.href = 'article.html?slug=' + a.prev;
  } else {
    prevLink.href = '../index.html#thoughts';
    prevLink.textContent = '← All writing';
  }

  if (a.next) {
    nextLink.href = 'article.html?slug=' + a.next;
  } else {
    nextLink.classList.add('hidden');
  }

  document.getElementById('loading').style.display = 'none';
  const articleEl = document.getElementById('article');
  articleEl.style.display = 'block';
  requestAnimationFrame(() => articleEl.classList.add('ready'));
}
</script>
</body>
</html>
